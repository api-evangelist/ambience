aid: ambience
name: Ambience
description: Ambience Healthcare builds an AI operating system for healthcare that reduces clinician administrative
  burden and protects revenue integrity at the point of care. Its ambient AI platform performs real-time
  medical encounter transcription, clinical note generation, integrated clinical documentation improvement
  (CDI) with ICD-10 coding suggestions, and EHR patient-context enrichment across more than 100 specialties
  in outpatient, emergency, and inpatient settings. The platform integrates directly with major EHRs including
  Epic, Oracle Cerner, and athenahealth. Founded in 2020 and headquartered in San Francisco, Ambience
  is backed by roughly $370M in funding, including a $243M Series C co-led by Andreessen Horowitz (a16z)
  and Oak HC/FT. Ambience exposes a gated Integration API (documentation and access granted on request
  via emr-integration@ambiencehealthcare.com) rather than a public self-serve developer program.
